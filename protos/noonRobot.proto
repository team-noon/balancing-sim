#VRML_SIM R2025a utf8
# The robot that we will be training
# template language: javascript


PROTO noonRobot [

  # ----- GENERAL ------
  field SFVec3f translation 0 0 0
  field SFString name "robot"
  field SFString controller "<generic>"
  
  # ----- BODY ------
  field SFVec3f bodySize 0.15 0.06 0.25 # [m, m, m]
  field SFFloat bodyMass 0.456 # [m]
  
  # ----- HEAD ------
  field SFFloat headSize 0.04 # [m]
  field SFFloat headMass 0.06 # [kg]

  field SFFloat headMaxAngle 1 # the amount the head will be able to turn, in each direction (left and right) [rad]

  # ----- ARM ------
  field SFFloat armRadius 0.01 # [m]

  field SFFloat upperArmLength 0.121 # [m]
  field SFFloat upperArmMass 0.028 # [kg] 

  field SFFloat lowerArmLength 0.1515 # [m]
  field SFFloat lowerArmMass 0.014 # [kg] 

  field SFFloat handRadius 0.015 # [m]
  field SFFloat handMass 0.01 # [kg]

  field SFFloat armOffset 0.01 # the offset of the arm calculated from the top of the body, armRadius will always be given to this, so it will always be offset by at least armRadius (i mean unless the arm offset is negative but why the fuck would you do that tbh) #[m]

  field SFVec2f shoulderYMotorLimits -100 100 # [rad, rad] min and then max, forward and backwards rotation
  field SFVec2f shoulderYHardLimits -200 200 # [rad, rad]

  field SFVec2f shoulderZMotorLimits -100 100 # [rad, rad] min and then max, up and down rotation
  field SFVec2f shoulderZHardLimits -200 200 # [rad, rad] 

  field SFVec2f elbowYMotorLimits -100 100 # [rad, rad] forward and backwards
  field SFVec2f elbowYHardLimits -200 200 # [rad, rad]

  # ------- LEGS -------

  field SFFloat legRadius 0.015 # [m]

  field SFFloat upperLegLength 0.105 # [m]
  field SFFloat upperLegMass 0.05 # [kg]

  field SFFloat lowerLegLength 0.18 # [m]
  field SFFloat lowerLegMass 0.04 # [kg]

  field SFFloat footLength 0.1 # [m]
  field SFFloat footWidth 0.07 # [m]
  field SFFloat footHeight 0.02 # [m]
  field SFFloat footMass 0.02 # [kg]
  field SFFloat footOffset 0.01 # [m] basically how in the foot (rectangle is) 0 is the legradius and anything more just pushes it more in (SAME AS THE OTHER 2 OFFSETS MAN)

  field SFFloat legOffset 0.02 # [m] offset from the side of the body, basically how in the legs are modeled to be, 0 is basically equal to the legRadius and it just add to that (same as the fucking arm offset i dont know why i am over explaining things (i will only ever be the only person reading this, if im not then this is my way of sending a message: SOMEONE END MY SUFFERING))

  field SFVec2f hipXMotorLimits -100 100 # [rad, rad]
  field SFVec2f hipXHardLimits -200 200 # [rad, rad]

  field SFVec2f hipYMotorLimits -100 100 # [rad, rad]
  field SFVec2f hipYHardLimits -200 200 # [rad, rad]

  field SFVec2f hipZMotorLimits -100 100 # [rad, rad]
  field SFVec2f hipZHardLimits -200 200 # [rad, rad]


  field SFVec2f kneeXMotorLimits -100 100 # [rad, rad]
  field SFVec2f kneeXHardLimits -200 200 # [rad, rad]


  field SFVec2f footXMotorLimits -100 100 # [rad, rad]
  field SFVec2f footXHardLimits -200 200 # [rad, rad]

  field SFVec2f footYMotorLimits -100 100 # [rad, rad]
  field SFVec2f footYHardLimits -200 200 # [rad, rad]

  
]
{
  Robot {
    translation IS translation
    name IS name
    controller IS controller
    children [
      # BODY
      Solid{
        name "body"
        children [
          DEF BODYSHAPE Shape {
            geometry Box{
              size IS bodySize
            }
            appearance DEF MATERIAL PBRAppearance{
              metalness 0.1      
            }
          }
        ]
      }
      
      # HEAD
      HingeJoint{
        jointParameters HingeJointParameters{
          axis 0 0 1
          anchor %<=`0 0 ${fields.bodySize.value.z / 2}`>%
          # TODO JOINT HARD LIMITS
        }
        device [
          RotationalMotor{
            name "RM_HEAD"
            # TODO MOTOR LIMITS
          }
          PositionSensor{
            name "PS_HEAD"
          }
        ]
        
        endPoint Solid{
          translation %<=`0 0 ${fields.bodySize.value.z / 2 + fields.headSize.value / 2}`>%
          name "head"
          children [
            DEF HEADSHAPE Shape{
              geometry Box{
                %<=`size ${fields.headSize.value} ${fields.headSize.value} ${fields.headSize.value}`>%
              }
              appearance USE MATERIAL
            }

            # EYES
            Pose{
              translation %<=` ${fields.headSize.value / 2} ${fields.headSize.value / 2} 0`>%
              children[
                Shape{
                  geometry DEF EYEGEOMETRY Sphere{
                    subdivision 5
                    radius %<=`${fields.headSize.value / 6}`>%
                  }
                  appearance DEF EYEMATERIAL PBRAppearance{
                    baseColor 1 0 0
                    metalness 0.1      
                  }
                }
              ]
            }

            Pose{
              translation %<=` ${fields.headSize.value / -2}  ${fields.headSize.value / 2} 0`>%
              children[
                Shape{
                  geometry USE EYEGEOMETRY
                  appearance USE EYEMATERIAL
                }
              ]
            }
          ]
          
          physics Physics{
            mass IS headMass
            density -1
          }
          
          boundingObject USE HEADSHAPE
        }
      }

      # LEFT (UPPER) ARM
      Hinge2Joint{
        jointParameters HingeJointParameters{
          anchor %<= `${-fields.bodySize.value.x / 2} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          axis 0 1 0

          minStop %<=`${fields.shoulderYHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderYHardLimits.value.y}`>%
        }

        device [
          RotationalMotor{
            name "RM_Y_LEFT_SHOULDER"

            minPosition %<=`${fields.shoulderYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_LEFT_SHOULDER"
          }
        ]

        jointParameters2 JointParameters{
          axis 0 0 1
          
          minStop %<=`${fields.shoulderZHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderZHardLimits.value.y}`>%
        }

        device2 [
          RotationalMotor{
            name "RM_Z_LEFT_SHOULDER"
            
            minPosition %<=`${fields.shoulderZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_LEFT_SHOULDER"
          }
        ]

        # LEFT UPPER ARM
        endPoint Solid{
          translation %<= `${-fields.bodySize.value.x / 2 - fields.upperArmLength.value / 2} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          rotation 0 1 0 1.570796

          name "left_upper_arm"

          children [
            DEF UpperArmShape Shape{
              geometry Cylinder{
                height IS upperArmLength
                radius IS armRadius
              }
              appearance USE MATERIAL
            }

            # LEFT LOWER ARM
            HingeJoint{
              jointParameters HingeJointParameters{
                anchor %<= `0 0 ${-fields.upperArmLength.value / 2 }` >%
                axis 0 1 0

                minStop %<=`${fields.elbowYHardLimits.value.x}`>%
                maxStop %<=`${fields.elbowYHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_Y_LEFT_ELBOW"

                  minPosition %<=`${fields.elbowYMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.elbowYMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_Y_LEFT_ELBOW"
                }
              ]
              
              endPoint Solid {
                translation 0 0 %<=`${-fields.lowerArmLength.value / 2 - fields.upperArmLength.value/2}`>% 

                name "left_lower_arm"
                children [
                  DEF LowerArmShape Shape{
                    geometry Cylinder{
                      height IS lowerArmLength
                      radius IS armRadius
                    }
                    appearance USE MATERIAL
                  }
                  Solid{
                    name "left_hand"

                    translation 0 0 %<=`${-fields.lowerArmLength.value/2 - fields.handRadius.value}`>%

                    children [
                      DEF HandShape Shape{
                        geometry Sphere{
                          radius IS handRadius
                        }
                        appearance USE MATERIAL
                      }
                    ]

                    physics Physics {
                      mass  IS handMass
                      density -1
                    }
                    boundingObject USE HandShape
                  }

                ]
                physics Physics { 
                  mass IS lowerArmMass
                  density -1  
                }
                boundingObject USE LowerArmShape
              }

            }
          ]
          
          physics Physics{
            mass IS upperArmMass
            density -1
          }
          
          boundingObject USE UpperArmShape
        }
      }

      # RIGHT ARM
      Hinge2Joint{
        jointParameters HingeJointParameters{
          anchor %<= `${-(-fields.bodySize.value.x / 2)} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          axis 0 1 0

          minStop %<=`${fields.shoulderYHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderYHardLimits.value.y}`>%
        }

        device [
          RotationalMotor{
            name "RM_Y_RIGHT_SHOULDER"

            minPosition %<=`${fields.shoulderYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_RIGHT_SHOULDER"
          }
        ]

        jointParameters2 JointParameters{
          axis 0 0 1
          
          minStop %<=`${fields.shoulderZHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderZHardLimits.value.y}`>%
        }

        device2 [
          RotationalMotor{
            name "RM_Z_RIGHT_SHOULDER"
            
            minPosition %<=`${fields.shoulderZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_RIGHT_SHOULDER"
          }
        ]

        # RIGHT UPPER ARM
        endPoint Solid{
          translation %<= `${-(-fields.bodySize.value.x / 2 - fields.upperArmLength.value / 2)} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          rotation 0 1 0 -1.570796

          name "right_upper_arm"

          children [
              USE UpperArmShape 
              

            # RIGHT LOWER ARM
            HingeJoint{
              jointParameters HingeJointParameters{
                anchor %<= `0 0 ${-fields.upperArmLength.value / 2 }` >%
                axis 0 1 0

                minStop %<=`${fields.elbowYHardLimits.value.x}`>%
                maxStop %<=`${fields.elbowYHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_Y_RIGHT_ELBOW"

                  minPosition %<=`${fields.elbowYMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.elbowYMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_Y_RIGHT_ELBOW"
                }
              ]
              
              endPoint Solid {
                translation 0 0 %<=`${-fields.lowerArmLength.value / 2 - fields.upperArmLength.value/2}`>% 

                name "right_lower_arm"
                children [
                  USE LowerArmShape
                  Solid{
                    name "right_hand"

                    translation 0 0 %<=`${-fields.lowerArmLength.value/2 - fields.handRadius.value}`>%

                    children [
                      USE HandShape 
                    ]

                    physics Physics {
                      mass  IS handMass
                      density -1
                    }
                    boundingObject USE HandShape
                  }

                ]
                physics Physics { 
                  mass IS lowerArmMass
                  density -1  
                }
                boundingObject USE LowerArmShape
              }

            }
          ]
          
          physics Physics{
            mass IS upperArmMass
            density -1
          }
          
          boundingObject USE UpperArmShape
        }

      }

      # LEFT LEG
      BallJoint{
        jointParameters BallJointParameters{
          anchor %<=`${fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value  } 0 ${fields.bodySize.value.z / -2}`>%
          minStop %<=`${fields.hipXHardLimits.value.x}`>%
          maxStop %<=`${fields.hipXHardLimits.value.y}`>%
        }

        jointParameters2 JointParameters{
          axis 0 1 0
          minStop %<=`${fields.hipYHardLimits.value.x}`>%
          maxStop %<=`${fields.hipYHardLimits.value.y}`>%
        }

        jointParameters3 JointParameters{
          axis 0 0 1
          minStop %<=`${fields.hipZHardLimits.value.x}`>%
          maxStop %<=`${fields.hipZHardLimits.value.y}`>%
        }

        device[
          RotationalMotor{
            name "RM_X_LEFT_HIP"
            minPosition %<=`${fields.hipXMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipXMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_X_LEFT_HIP"
          }
        ]

        device2[
          RotationalMotor{
            name "RM_Y_LEFT_HIP"
            minPosition %<=`${fields.hipYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_LEFT_HIP"
          }
        ]

        device3[
          RotationalMotor{
            name "RM_Z_LEFT_HIP"
            minPosition %<=`${fields.hipZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_LEFT_HIP"
          }
        ]

        endPoint Solid{
          name "left_upper_leg"
          translation %<=`${fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value  } 0 ${fields.bodySize.value.z / -2 - fields.upperLegLength.value / 2}`>%
          

          children[
            DEF UpperLegShape Shape{
              geometry Cylinder{
                radius IS legRadius
                height IS upperLegLength
              }
              appearance USE MATERIAL
            }

            HingeJoint{
              jointParameters HingeJointParameters{
                anchor 0 0 %<=`${fields.upperLegLength.value / -2}`>%
                minStop %<=`${fields.kneeXHardLimits.value.x}`>%
                maxStop %<=`${fields.kneeXHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_X_LEFT_KNEE"
                  minPosition %<=`${fields.kneeXMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.kneeXMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_X_LEFT_KNEE"
                }
              ]

              endPoint Solid{
                name "left_lower_leg"

                translation 0 0 %<=`${fields.lowerLegLength.value / -2 - fields.upperLegLength.value / 2}`>%

                children [
                  DEF LowerLegShape Shape{
                    geometry Cylinder{
                      height IS lowerLegLength
                      radius IS legRadius
                    }
                    appearance USE MATERIAL
                  }

                  Hinge2Joint{
                    jointParameters HingeJointParameters{
                      axis 1 0 0
                      anchor 0 0 %<=`${fields.lowerLegLength.value / -2}`>%
                      minStop %<=`${fields.footXHardLimits.value.x}`>%
                      maxStop %<=`${fields.footXHardLimits.value.y}`>%

                    }

                    jointParameters2 JointParameters{
                      axis 0 1 0
                      minStop %<=`${fields.footYHardLimits.value.x}`>%
                      maxStop %<=`${fields.footYHardLimits.value.y}`>%
                    }


                    device [
                      RotationalMotor{
                        name "RM_X_LEFT_FOOT"
                        minPosition %<=`${fields.footXMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footXMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_X_LEFT_FOOT"
                      }
                    ]

                    device2 [
                      RotationalMotor{
                        name "RM_Y_LEFT_FOOT"
                        minPosition %<=`${fields.footYMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footYMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_Y_LEFT_FOOT"
                      }
                    ]

                    endPoint Solid{
                      name "left_foot"
                      translation 0  %<=`${fields.footLength.value / 2 - fields.legRadius.value - fields.legOffset.value} ${fields.lowerLegLength.value/-2 - fields.footHeight.value / 2}`>%

                      children[
                        DEF FootShape Shape{
                          geometry Box{
                            size %<=`${fields.footWidth.value} ${fields.footLength.value} ${fields.footHeight.value}`>%
                          }
                          appearance USE MATERIAL
                        }

                      ]

                      physics Physics {
                        mass IS footMass
                        density -1
                      }

                      boundingObject USE FootShape
                    }
                  }
                ]
                
                physics Physics {
                  mass IS lowerLegMass
                  density -1
                }

                boundingObject USE LowerLegShape
              }
            }
          ]

          physics Physics {
            mass IS upperLegMass
            density -1
          }

          boundingObject USE UpperLegShape
        }
      }
      
      # RIGHT LEG
      BallJoint{
        jointParameters BallJointParameters{
          anchor %<=`${-(fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value  )} 0 ${fields.bodySize.value.z / -2}`>%
          minStop %<=`${fields.hipXHardLimits.value.x}`>%
          maxStop %<=`${fields.hipXHardLimits.value.y}`>%
        }

        jointParameters2 JointParameters{
          axis 0 1 0
          minStop %<=`${fields.hipYHardLimits.value.x}`>%
          maxStop %<=`${fields.hipYHardLimits.value.y}`>%
        }

        jointParameters3 JointParameters{
          axis 0 0 1
          minStop %<=`${fields.hipZHardLimits.value.x}`>%
          maxStop %<=`${fields.hipZHardLimits.value.y}`>%
        }

        device[
          RotationalMotor{
            name "RM_X_RIGHT_HIP"
            minPosition %<=`${fields.hipXMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipXMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_X_RIGHT_HIP"
          }
        ]

        device2[
          RotationalMotor{
            name "RM_Y_RIGHT_HIP"
            minPosition %<=`${fields.hipYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_RIGHT_HIP"
          }
        ]

        device3[
          RotationalMotor{
            name "RM_Z_RIGHT_HIP"
            minPosition %<=`${fields.hipZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_RIGHT_HIP"
          }
        ]

        endPoint Solid{
          name "right_upper_leg"
          translation %<=`${-(fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value ) } 0 ${fields.bodySize.value.z / -2 - fields.upperLegLength.value / 2}`>%
          

          children[
            USE UpperLegShape 

            HingeJoint{
              jointParameters HingeJointParameters{
                anchor 0 0 %<=`${fields.upperLegLength.value / -2}`>%
                minStop %<=`${fields.kneeXHardLimits.value.x}`>%
                maxStop %<=`${fields.kneeXHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_X_RIGHT_KNEE"
                  minPosition %<=`${fields.kneeXMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.kneeXMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_X_RIGHT_KNEE"
                }
              ]

              endPoint Solid{
                name "right_lower_leg"

                translation 0 0 %<=`${fields.lowerLegLength.value / -2 - fields.upperLegLength.value / 2}`>%

                children [
                  USE LowerLegShape

                  Hinge2Joint{
                    jointParameters HingeJointParameters{
                      axis 1 0 0
                      anchor 0 0 %<=`${fields.lowerLegLength.value / -2}`>%
                      minStop %<=`${fields.footXHardLimits.value.x}`>%
                      maxStop %<=`${fields.footXHardLimits.value.y}`>%

                    }

                    jointParameters2 JointParameters{
                      axis 0 1 0
                      minStop %<=`${fields.footYHardLimits.value.x}`>%
                      maxStop %<=`${fields.footYHardLimits.value.y}`>%
                    }


                    device [
                      RotationalMotor{
                        name "RM_X_RIGHT_FOOT"
                        minPosition %<=`${fields.footXMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footXMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_X_RIGHT_FOOT"
                      }
                    ]

                    device2 [
                      RotationalMotor{
                        name "RM_Y_RIGHT_FOOT"
                        minPosition %<=`${fields.footYMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footYMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_Y_RIGHT_FOOT"
                      }
                    ]

                    endPoint Solid{
                      name "right_foot"
                      translation 0  %<=`${fields.footLength.value / 2 - fields.legRadius.value - fields.legOffset.value} ${fields.lowerLegLength.value/-2 - fields.footHeight.value / 2}`>%

                      children[
                        USE FootShape

                      ]

                      physics Physics {
                        mass IS footMass
                        density -1
                      }

                      boundingObject USE FootShape
                    }
                  }
                ]
                
                physics Physics {
                  mass IS lowerLegMass
                  density -1
                }

                boundingObject USE LowerLegShape
              }
            }
          ]

          physics Physics {
            mass IS upperLegMass
            density -1
          }

          boundingObject USE UpperLegShape
        }
      }
    ]
    

    physics Physics {
      mass IS bodyMass
      density -1
    }


    boundingObject USE BODYSHAPE
  }
}
