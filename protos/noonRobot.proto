#VRML_SIM R2025a utf8

PROTO noonRobot [

  # ----- GENERAL ------
  field SFVec3f translation 0 0 0
  field SFString name "noonRobot"
  field SFString controller "noonRobotTrainer"

  field SFBool inference FALSE

  # ----- MOTORS ------
  field SFFloat BLDCMaxTorque 35
  field SFFloat ServoMaxTorque 10


  # ----- BODY ------
  field SFVec3f bodySize 0.15 0.06 0.25 # [m, m, m]
  field SFFloat bodyMass 0.456 # [kg]
  
  # ----- HEAD ------
  field SFFloat headSize 0.04 # [m]
  field SFFloat headMass 0.06 # [kg]

  field SFFloat headMotorLimit 1 # [deg] the amount the head will be able to turn, in each direction (left and right) [rad]
  field SFFloat headHardLimit 1.2 # [deg]


  # ----- ARM ------
  field SFFloat armRadius 0.01 # [m]

  field SFFloat upperArmLength 0.121 # [m]
  field SFFloat upperArmMass 0.028 # [kg] 

  field SFFloat lowerArmLength 0.1515 # [m]
  field SFFloat lowerArmMass 0.014 # [kg] 

  field SFFloat handRadius 0.015 # [m]
  field SFFloat handMass 0.01 # [kg]

  field SFFloat armOffset 0.01 # the offset of the arm calculated from the top of the body, armRadius will always be given to this, so it will always be offset by at least armRadius (i mean unless the arm offset is negative but why the fuck would you do that tbh) #[m]

  field SFVec2f shoulderYMotorLimits -145 145 # -75 75 # [deg, deg] min and then max, up and down
  field SFVec2f shoulderYHardLimits -145 145 #-120 120 # [deg, deg]

  # original: field SFVec2f shoulderZMotorLimits -120 120 # [deg, deg] min and then max, forward and backward
  field SFVec2f shoulderZMotorLimits -145 145 # [deg, deg] min and then max, forward and backward
  # original: field SFVec2f shoulderZHardLimits -150 150 # [deg, deg] 
  field SFVec2f shoulderZHardLimits -145 145 # [deg, deg] 

  # original: field SFVec2f elbowYMotorLimits -5 150 # [deg, deg] forward and backwards
  field SFVec2f elbowYMotorLimits -145 145 # [deg, deg] forward and backwards
  # original: field SFVec2f elbowYHardLimits -10 160 # [deg, deg]
  field SFVec2f elbowYHardLimits -145 145 # [deg, deg]

  # ------- LEGS -------

  field SFFloat legRadius 0.015 # [m]

  field SFFloat upperLegLength 0.105 # [m]
  field SFFloat upperLegMass 0.05 # [kg]

  field SFFloat lowerLegLength 0.18 # [m]
  field SFFloat lowerLegMass 0.04 # [kg]

  field SFFloat footLength 0.1 # [m]
  field SFFloat footWidth 0.07 # [m]
  field SFFloat footHeight 0.02 # [m]
  field SFFloat footMass 0.02 # [kg]
  field SFFloat footOffset 0.01 # [m] basically how in the foot (rectangle is) 0 is the legradius and anything more just pushes it more in (SAME AS THE OTHER 2 OFFSETS MAN)

  field SFFloat legOffset 0.02 # [m] offset from the side of the body, basically how in the legs are modeled to be, 0 is basically equal to the legRadius and it just add to that (same as the fucking arm offset i dont know why i am over explaining things (i will only ever be the only person reading this, if im not then this is my way of sending a message: SOMEONE END MY SUFFERING))

  # original: field SFVec2f hipXMotorLimits -30 120 # [deg, deg]
  field SFVec2f hipXMotorLimits -145 145 # [deg, deg]
  # original: field SFVec2f hipXHardLimits -40 140 # [deg, deg]
  field SFVec2f hipXHardLimits -145 145 # [deg, deg]

  # original: field SFVec2f hipYMotorLimits -45 45 # [deg, deg]
  field SFVec2f hipYMotorLimits -145 145 # [deg, deg]
  # original: field SFVec2f hipYHardLimits -60 60 # [deg, deg]
  field SFVec2f hipYHardLimits -145 145 # [deg, deg]

  # original: field SFVec2f hipZMotorLimits -60 60# [deg, deg]
  field SFVec2f hipZMotorLimits -145 145 # [deg, deg]
  # original: field SFVec2f hipZHardLimits -90 90 # [deg, deg]
  field SFVec2f hipZHardLimits -145 145 # [deg, deg]


  # original: field SFVec2f kneeXMotorLimits -130 5 # [deg, deg]
  field SFVec2f kneeXMotorLimits -145 145 # [deg, deg]
  # original: field SFVec2f kneeXHardLimits -140 10 # [deg, deg]
  field SFVec2f kneeXHardLimits -145 145 # [deg, deg]


  # original: field SFVec2f footXMotorLimits -30 45 # [deg, deg]
  field SFVec2f footXMotorLimits -145 145 # [deg, deg]
  # original: field SFVec2f footXHardLimits -45 60 # [deg, deg]
  field SFVec2f footXHardLimits -145 145 # [deg, deg]

  # original: field SFVec2f footYMotorLimits -20 20 # [deg, deg]
  field SFVec2f footYMotorLimits -145 145 # [deg, deg]
  # original: field SFVec2f footYHardLimits -30 30 # [deg, deg]
  field SFVec2f footYHardLimits -145 145 # [deg, deg]

  
]
{
  Robot {
    translation  %<=`${fields.translation.value.x} ${fields.translation.value.y} ${fields.translation.value.z + fields.footHeight.value + fields.lowerLegLength.value + fields.upperLegLength.value + fields.bodySize.value.z / 2}`>%
    name IS name
    controller IS controller
    supervisor TRUE
    children [
      # BODY
      Solid{
        name "body"
        
        children [
          DEF BODYSHAPE Shape {
            geometry Box{
              size IS bodySize
            }
            appearance DEF MATERIAL PBRAppearance{
              metalness 0.1      
            }
          }
          TouchSensor{
            name "TS_BODY"
            type "bumper"
            boundingObject Box{
              size IS bodySize
            }
          }
        ]
        boundingObject Box{
          size IS bodySize
        }
        physics Physics {
          mass IS bodyMass
          density -1
        }
      }
      
      # HEAD
      HingeJoint{
        jointParameters HingeJointParameters{
          axis 0 0 1
          anchor %<=`0 0 ${fields.bodySize.value.z / 2}`>%
          minStop %<=`${-fields.headHardLimit.value }`>%
          maxStop %<=`${fields.headHardLimit.value }`>%

        }
        device [
          RotationalMotor{
            name "RM_Z_HEAD"
            minPosition %<=`${-fields.headMotorLimit.value}`>%
            maxPosition %<=`${fields.headMotorLimit.value}`>%
            maxTorque IS ServoMaxTorque
          }
          PositionSensor{
            name "PS_Z_HEAD"
          }
        ]
        
        endPoint Solid{
          translation %<=`0 0 ${fields.bodySize.value.z / 2 + fields.headSize.value / 2}`>%
          name "head"
          children [
            DEF HEADSHAPE Shape{
              geometry Box{
                %<=`size ${fields.headSize.value} ${fields.headSize.value} ${fields.headSize.value}`>%
              }
              appearance USE MATERIAL
            }

            TouchSensor{
              name "TS_HEAD"
              type "bumper"
              boundingObject Box{
                %<=`size ${fields.headSize.value} ${fields.headSize.value} ${fields.headSize.value}`>%
              }
            }

            # EYES
            Pose{
              translation %<=` ${fields.headSize.value / 2} ${fields.headSize.value / 2} 0`>%
              children[
                Shape{
                  geometry DEF EYEGEOMETRY Sphere{
                    subdivision 5
                    radius %<=`${fields.headSize.value / 6}`>%
                  }
                  appearance DEF EYEMATERIAL PBRAppearance{
                    baseColor 1 0 0
                    metalness 0.1      
                  }
                }
              ]
            }

            Pose{
              translation %<=` ${fields.headSize.value / -2}  ${fields.headSize.value / 2} 0`>%
              children[
                Shape{
                  geometry USE EYEGEOMETRY
                  appearance USE EYEMATERIAL
                }
              ]
            }
          ]
          
          physics Physics{
            mass IS headMass
            density -1
          }
          
          boundingObject USE HEADSHAPE
        }
      }

      # LEFT (UPPER) ARM
      Hinge2Joint{
        jointParameters HingeJointParameters{
          anchor %<= `${-fields.bodySize.value.x / 2} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          axis 0 1 0

          minStop %<=`${fields.shoulderYHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderYHardLimits.value.y}`>%
        }

        device [
          RotationalMotor{
            name "RM_Y_LEFT_SHOULDER"
            maxTorque IS ServoMaxTorque

            minPosition %<=`${fields.shoulderYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_LEFT_SHOULDER"
          }
        ]

        jointParameters2 JointParameters{
          axis 0 0 1
          
          minStop %<=`${fields.shoulderZHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderZHardLimits.value.y}`>%
        }

        device2 [
          RotationalMotor{
            name "RM_Z_LEFT_SHOULDER"
            maxTorque IS ServoMaxTorque
            
            minPosition %<=`${fields.shoulderZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_LEFT_SHOULDER"
          }
        ]

        # LEFT UPPER ARM
        endPoint Solid{
          translation %<= `${-fields.bodySize.value.x / 2 - fields.upperArmLength.value / 2} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          rotation 0 1 0 1.570796

          name "left_upper_arm"

          children [
            DEF UpperArmShape Shape{
              geometry Cylinder{
                height IS upperArmLength
                radius IS armRadius
              }
              appearance USE MATERIAL
            }

            TouchSensor{
              name "TS_LEFT_UPPER_ARM"
              type "bumper"
              boundingObject Cylinder{
                height IS upperArmLength
                radius IS armRadius
              }
            }

            # LEFT LOWER ARM
            HingeJoint{
              jointParameters HingeJointParameters{
                anchor %<= `0 0 ${-fields.upperArmLength.value / 2 }` >%
                axis 0 -1 0

                minStop %<=`${fields.elbowYHardLimits.value.x}`>%
                maxStop %<=`${fields.elbowYHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_Y_LEFT_ELBOW"
                  maxTorque IS ServoMaxTorque

                  minPosition %<=`${fields.elbowYMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.elbowYMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_Y_LEFT_ELBOW"
                }
              ]
              
              endPoint Solid {
                translation 0 0 %<=`${-fields.lowerArmLength.value / 2 - fields.upperArmLength.value/2}`>% 

                name "left_lower_arm"
                children [
                  DEF LowerArmShape Shape{
                    geometry Cylinder{
                      height IS lowerArmLength
                      radius IS armRadius
                    }
                    appearance USE MATERIAL
                  }
                  TouchSensor{
                    name "TS_LEFT_LOWER_ARM"
                    type "bumper"
                    boundingObject Cylinder{
                      height IS lowerArmLength
                      radius IS armRadius
                    }
                  }
                  Solid{
                    name "left_hand"

                    translation 0 0 %<=`${-fields.lowerArmLength.value/2 - fields.handRadius.value}`>%

                    children [
                      DEF HandShape Shape{
                        geometry Sphere{
                          radius IS handRadius
                        }
                        appearance USE MATERIAL
                      }
                      TouchSensor{
                        name "TS_LEFT_HAND"
                        type "bumper"
                        boundingObject Sphere{
                          radius IS handRadius
                        }
                      }
                    ]

                    physics Physics {
                      mass  IS handMass
                      density -1
                    }
                    boundingObject USE HandShape
                  }

                ]
                physics Physics { 
                  mass IS lowerArmMass
                  density -1  
                }
                boundingObject USE LowerArmShape
              }

            }
          ]
          
          physics Physics{
            mass IS upperArmMass
            density -1
          }
          
          boundingObject USE UpperArmShape
        }
      }

      # RIGHT ARM
      Hinge2Joint{
        jointParameters HingeJointParameters{
          anchor %<= `${-(-fields.bodySize.value.x / 2)} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          axis 0 1 0

          minStop %<=`${fields.shoulderYHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderYHardLimits.value.y}`>%
        }

        device [
          RotationalMotor{
            name "RM_Y_RIGHT_SHOULDER"
            maxTorque IS ServoMaxTorque

            minPosition %<=`${fields.shoulderYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_RIGHT_SHOULDER"
          }
        ]

        jointParameters2 JointParameters{
          axis 0 0 1
          
          minStop %<=`${fields.shoulderZHardLimits.value.x}`>%
          maxStop %<=`${fields.shoulderZHardLimits.value.y}`>%
        }

        device2 [
          RotationalMotor{
            name "RM_Z_RIGHT_SHOULDER"
            maxTorque IS ServoMaxTorque
            
            minPosition %<=`${fields.shoulderZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.shoulderZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_RIGHT_SHOULDER"
          }
        ]

        # RIGHT UPPER ARM
        endPoint Solid{
          translation %<= `${-(-fields.bodySize.value.x / 2 - fields.upperArmLength.value / 2)} 0 ${fields.bodySize.value.z/ 2 - (fields.armOffset.value + fields.armRadius.value)}` >%
          rotation 0 1 0 -1.570796

          name "right_upper_arm"

          children [
            USE UpperArmShape 
            TouchSensor{
              name "TS_RIGHT_UPPER_ARM"
              type "bumper"
              boundingObject Cylinder{
                height IS upperArmLength
                radius IS armRadius
              }
            }
              

            # RIGHT LOWER ARM
            HingeJoint{
              jointParameters HingeJointParameters{
                anchor %<= `0 0 ${-fields.upperArmLength.value / 2 }` >%
                axis 0 1 0

                minStop %<=`${fields.elbowYHardLimits.value.x}`>%
                maxStop %<=`${fields.elbowYHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_Y_RIGHT_ELBOW"
                  maxTorque IS ServoMaxTorque

                  minPosition %<=`${fields.elbowYMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.elbowYMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_Y_RIGHT_ELBOW"
                }
              ]
              
              endPoint Solid {
                translation 0 0 %<=`${-fields.lowerArmLength.value / 2 - fields.upperArmLength.value/2}`>% 

                name "right_lower_arm"
                children [
                  USE LowerArmShape
                  TouchSensor{
                    name "TS_RIGHT_LOWER_ARM"
                    type "bumper"
                    boundingObject Cylinder{
                      height IS lowerArmLength
                      radius IS armRadius
                    }
                  }
                  Solid{
                    name "right_hand"

                    translation 0 0 %<=`${-fields.lowerArmLength.value/2 - fields.handRadius.value}`>%

                    children [
                      USE HandShape
                      TouchSensor{
                        name "TS_RIGHT_HAND"
                        type "bumper"
                        boundingObject Sphere{
                          radius IS handRadius
                        }
                      }
                    ]

                    physics Physics {
                      mass  IS handMass
                      density -1
                    }
                    boundingObject USE HandShape
                  }

                ]
                physics Physics { 
                  mass IS lowerArmMass
                  density -1  
                }
                boundingObject USE LowerArmShape
              }

            }
          ]
          
          physics Physics{
            mass IS upperArmMass
            density -1
          }
          
          boundingObject USE UpperArmShape
        }

      }

      # LEFT LEG
      BallJoint{
        jointParameters BallJointParameters{
          anchor %<=`${fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value  } 0 ${fields.bodySize.value.z / -2}`>%
          minStop %<=`${fields.hipXHardLimits.value.x}`>%
          maxStop %<=`${fields.hipXHardLimits.value.y}`>%
        }

        jointParameters2 JointParameters{
          axis 0 1 0
          minStop %<=`${fields.hipYHardLimits.value.x}`>%
          maxStop %<=`${fields.hipYHardLimits.value.y}`>%
        }

        jointParameters3 JointParameters{
          axis 0 0 1
          minStop %<=`${fields.hipZHardLimits.value.x}`>%
          maxStop %<=`${fields.hipZHardLimits.value.y}`>%
        }

        device[
          RotationalMotor{
            name "RM_X_LEFT_HIP"
            maxTorque IS BLDCMaxTorque
            minPosition %<=`${fields.hipXMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipXMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_X_LEFT_HIP"
          }
        ]

        device2[
          RotationalMotor{
            name "RM_Y_LEFT_HIP"
            maxTorque IS ServoMaxTorque
            minPosition %<=`${fields.hipYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_LEFT_HIP"
          }
        ]

        device3[
          RotationalMotor{
            name "RM_Z_LEFT_HIP"
            maxTorque IS ServoMaxTorque
            minPosition %<=`${fields.hipZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_LEFT_HIP"
          }
        ]

        endPoint Solid{
          name "left_upper_leg"
          translation %<=`${fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value  } 0 ${fields.bodySize.value.z / -2 - fields.upperLegLength.value / 2}`>%
          

          children[
            DEF UpperLegShape Shape{
              geometry Cylinder{
                radius IS legRadius
                height IS upperLegLength
              }
              appearance USE MATERIAL
            }

            TouchSensor{
              name "TS_LEFT_UPPER_LEG"
              type "bumper"
              boundingObject Cylinder{
                radius IS legRadius
                height IS upperLegLength
              }
            }

            HingeJoint{
              jointParameters HingeJointParameters{
                anchor 0 0 %<=`${fields.upperLegLength.value / -2}`>%
                minStop %<=`${fields.kneeXHardLimits.value.x}`>%
                maxStop %<=`${fields.kneeXHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_X_LEFT_KNEE"
                  maxTorque IS BLDCMaxTorque
                  minPosition %<=`${fields.kneeXMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.kneeXMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_X_LEFT_KNEE"
                }
              ]

              endPoint Solid{
                name "left_lower_leg"

                translation 0 0 %<=`${fields.lowerLegLength.value / -2 - fields.upperLegLength.value / 2}`>%

                children [
                  DEF LowerLegShape Shape{
                    geometry Cylinder{
                      height IS lowerLegLength
                      radius IS legRadius
                    }
                    appearance USE MATERIAL
                  }
                  TouchSensor{
                    name "TS_LEFT_LOWER_LEG"
                    type "bumper"
                    boundingObject Cylinder{
                      height IS lowerLegLength
                      radius IS legRadius
                    }
                  }                 

                  Hinge2Joint{
                    jointParameters HingeJointParameters{
                      axis 1 0 0
                      anchor 0 0 %<=`${fields.lowerLegLength.value / -2}`>%
                      minStop %<=`${fields.footXHardLimits.value.x}`>%
                      maxStop %<=`${fields.footXHardLimits.value.y}`>%

                    }

                    jointParameters2 JointParameters{
                      axis 0 1 0
                      minStop %<=`${fields.footYHardLimits.value.x}`>%
                      maxStop %<=`${fields.footYHardLimits.value.y}`>%
                    }


                    device [
                      RotationalMotor{
                        name "RM_X_LEFT_FOOT"
                        maxTorque IS BLDCMaxTorque
                        minPosition %<=`${fields.footXMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footXMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_X_LEFT_FOOT"
                      }
                    ]

                    device2 [
                      RotationalMotor{
                        name "RM_Y_LEFT_FOOT"
                        maxTorque IS ServoMaxTorque
                        minPosition %<=`${fields.footYMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footYMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_Y_LEFT_FOOT"
                      }
                    ]

                    endPoint Solid{
                      name "left_foot"
                      translation 0  %<=`${fields.footLength.value / 2 - fields.legRadius.value - fields.legOffset.value} ${fields.lowerLegLength.value/-2 - fields.footHeight.value / 2}`>%

                      children[
                        DEF FootShape Shape{
                          geometry Box{
                            size %<=`${fields.footWidth.value} ${fields.footLength.value} ${fields.footHeight.value}`>%
                          }
                          appearance USE MATERIAL
                        }
                        TouchSensor{
                          name "TS_LEFT_FOOT"
                          type "bumper"
                          boundingObject Box{
                            size %<=`${fields.footWidth.value} ${fields.footLength.value} ${fields.footHeight.value}`>%
                          }
                        }
                      ]

                      physics Physics {
                        mass IS footMass
                        density -1
                      }

                      boundingObject USE FootShape
                    }
                  }
                ]
                
                physics Physics {
                  mass IS lowerLegMass
                  density -1
                }

                boundingObject USE LowerLegShape
              }
            }
          ]

          physics Physics {
            mass IS upperLegMass
            density -1
          }

          boundingObject USE UpperLegShape
        }
      }
      
      # RIGHT LEG
      BallJoint{
        jointParameters BallJointParameters{
          anchor %<=`${-(fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value  )} 0 ${fields.bodySize.value.z / -2}`>%
          minStop %<=`${fields.hipXHardLimits.value.x}`>%
          maxStop %<=`${fields.hipXHardLimits.value.y}`>%
        }

        jointParameters2 JointParameters{
          axis 0 1 0
          minStop %<=`${fields.hipYHardLimits.value.x}`>%
          maxStop %<=`${fields.hipYHardLimits.value.y}`>%
        }

        jointParameters3 JointParameters{
          axis 0 0 1
          minStop %<=`${fields.hipZHardLimits.value.x}`>%
          maxStop %<=`${fields.hipZHardLimits.value.y}`>%
        }

        device[
          RotationalMotor{
            name "RM_X_RIGHT_HIP"
            maxTorque IS BLDCMaxTorque
            minPosition %<=`${fields.hipXMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipXMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_X_RIGHT_HIP"
          }
        ]

        device2[
          RotationalMotor{
            name "RM_Y_RIGHT_HIP"
            maxTorque IS ServoMaxTorque
            minPosition %<=`${fields.hipYMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipYMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Y_RIGHT_HIP"
          }
        ]

        device3[
          RotationalMotor{
            name "RM_Z_RIGHT_HIP"
            maxTorque IS ServoMaxTorque
            minPosition %<=`${fields.hipZMotorLimits.value.x}`>%
            maxPosition %<=`${fields.hipZMotorLimits.value.y}`>%
          }
          PositionSensor{
            name "PS_Z_RIGHT_HIP"
          }
        ]

        endPoint Solid{
          name "right_upper_leg"
          translation %<=`${-(fields.bodySize.value.x / -2 + fields.legRadius.value/2 + fields.legOffset.value ) } 0 ${fields.bodySize.value.z / -2 - fields.upperLegLength.value / 2}`>%
          

          children[
            USE UpperLegShape
            TouchSensor{
              name "TS_RIGHT_UPPER_LEG"
              type "bumper"
              boundingObject Cylinder{
                radius IS legRadius
                height IS upperLegLength
              }
            } 

            HingeJoint{
              jointParameters HingeJointParameters{
                anchor 0 0 %<=`${fields.upperLegLength.value / -2}`>%
                minStop %<=`${fields.kneeXHardLimits.value.x}`>%
                maxStop %<=`${fields.kneeXHardLimits.value.y}`>%
              }

              device[
                RotationalMotor{
                  name "RM_X_RIGHT_KNEE"
                  maxTorque IS BLDCMaxTorque
                  minPosition %<=`${fields.kneeXMotorLimits.value.x}`>%
                  maxPosition %<=`${fields.kneeXMotorLimits.value.y}`>%
                }
                PositionSensor{
                  name "PS_X_RIGHT_KNEE"
                }
              ]

              endPoint Solid{
                name "right_lower_leg"

                translation 0 0 %<=`${fields.lowerLegLength.value / -2 - fields.upperLegLength.value / 2}`>%

                children [
                  USE LowerLegShape
                  TouchSensor{
                    name "TS_RIGHT_LOWER_LEG"
                    type "bumper"
                    boundingObject Cylinder{
                      height IS lowerLegLength
                      radius IS legRadius
                    }
                  }

                  Hinge2Joint{
                    jointParameters HingeJointParameters{
                      axis 1 0 0
                      anchor 0 0 %<=`${fields.lowerLegLength.value / -2}`>%
                      minStop %<=`${fields.footXHardLimits.value.x}`>%
                      maxStop %<=`${fields.footXHardLimits.value.y}`>%

                    }

                    jointParameters2 JointParameters{
                      axis 0 1 0
                      minStop %<=`${fields.footYHardLimits.value.x}`>%
                      maxStop %<=`${fields.footYHardLimits.value.y}`>%
                    }


                    device [
                      RotationalMotor{
                        name "RM_X_RIGHT_FOOT"
                        maxTorque IS BLDCMaxTorque
                        minPosition %<=`${fields.footXMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footXMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_X_RIGHT_FOOT"
                      }
                    ]

                    device2 [
                      RotationalMotor{
                        name "RM_Y_RIGHT_FOOT"
                        maxTorque IS ServoMaxTorque
                        minPosition %<=`${fields.footYMotorLimits.value.x}`>%
                        maxPosition %<=`${fields.footYMotorLimits.value.y}`>%
                      }
                      PositionSensor{
                        name "PS_Y_RIGHT_FOOT"
                      }
                    ]

                    endPoint Solid{
                      name "right_foot"
                      translation 0  %<=`${fields.footLength.value / 2 - fields.legRadius.value - fields.legOffset.value} ${fields.lowerLegLength.value/-2 - fields.footHeight.value / 2}`>%

                      children[
                        USE FootShape
                        TouchSensor{
                          name "TS_RIGHT_FOOT"
                          type "bumper"
                          boundingObject Box{
                            size %<=`${fields.footWidth.value} ${fields.footLength.value} ${fields.footHeight.value}`>%
                          }
                        }
                      ]

                      physics Physics {
                        mass IS footMass
                        density -1
                      }

                      boundingObject USE FootShape
                    }
                  }
                ]
                
                physics Physics {
                  mass IS lowerLegMass
                  density -1
                }

                boundingObject USE LowerLegShape
              }
            }
          ]

          physics Physics {
            mass IS upperLegMass
            density -1
          }

          boundingObject USE UpperLegShape
        }
      }

      Gyro{
        name "BODY_GYRO"
      }

      Accelerometer{
        name "BODY_ACCELEROMETER"
      }

      InertialUnit{
        name "BODY_INERTIALUNIT"
      }
    ]
    
    physics Physics {
      mass IS bodyMass
      density -1
    }

    boundingObject USE BODYSHAPE
  }
}